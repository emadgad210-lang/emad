<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسواق عماد الدين — تحويل بضاعة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--tx:#2b1a1b;--mut:#7d5658;--pri:#A52126;--ok:#A52126;--bd:#e6d0d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;padding:12px;max-width:900px}
.card{background:var(--card);border:1px solid var(--bd);border-top:4px solid #A52126;border-radius:12px;padding:14px;margin-bottom:12px}
.hd{display:flex;align-items:center;gap:14px;background:#fff;color:#A52126;border:1px solid var(--bd);border-bottom:4px solid #A52126;border-radius:12px;padding:10px 14px;margin-bottom:12px}.hd img{height:72px;border-radius:12px}.hd .t{font-size:22px;font-weight:700}.hd .s{font-size:14px;color:var(--mut)}
h1{font-size:20px;margin:4px 0 12px;color:#A52126}
h2{font-size:15px;margin:0 0 10px;color:#A52126}
th{color:#A52126}
button,input{font:inherit;color:var(--tx)}
input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.sec{background:#fff;color:#A52126;border:1px solid #A52126}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:130px}
.big{font-size:22px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
#item{display:none;border:2px solid #A52126;margin:10px 0 0}
#msg{min-height:22px;font-weight:600;margin-top:6px}
#res{margin-top:8px}
.r{padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.r:hover{border-color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right}
.wrap{overflow-x:auto;max-height:50vh}
video{width:100%;max-height:240px;border-radius:8px;background:#000;display:none;margin-top:8px}
</style>
</head>

<div class="card">
  <h2>الأصناف</h2>
  <div class="mut" id="info">جاري تحميل الأصناف...</div>
  <div class="row" id="updBox" style="display:none;margin-top:10px">
    <button id="updBtn">🔄 تحديث الأصناف</button>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" style="display:none">
  </div>
</div>

<div class="card" id="scanCard" style="display:none">
  <h2>امسح الباركود أو اكتب اسم الصنف / كوده</h2>
  <div class="row">
    <input id="scan" placeholder="امسح الباركود أو اكتب للبحث..." autocomplete="off">
    <button class="sec" id="camBtn" style="flex:0 0 auto">📷 كاميرا</button>
  </div>
  <video id="vid" playsinline muted></video>
  <div id="msg"></div>
  <div id="res"></div>
  <div id="item" class="card">
    <div class="mut">الكود: <span id="iCode" class="big"></span></div>
    <div class="big" id="iName" style="margin:6px 0"></div>
    <div class="mut" id="iPrev"></div>
    <div class="row" style="margin-top:8px">
      <label>الكمية<input id="qty" type="number" inputmode="decimal" min="0" step="any"></label>
      <button id="save" style="flex:0 0 auto">حفظ (Enter)</button>
    </div>
    <label class="mut" style="display:block;margin-top:8px"><input type="checkbox" id="add" checked style="width:auto"> لو الصنف اتسجل قبل كده، اجمع الكمية على السابقة</label>
  </div>
</div>

<div class="card" id="listCard" style="display:none">
  <div class="row" style="margin-bottom:10px">
    <h2 style="flex:2;margin:0">الأصناف المحوّلة (<span id="cnt">0</span>)</h2>
    <button id="exp">⬇ تصدير Excel</button>
    <button class="sec" id="clr">تحويل جديد</button>
  </div>
  <div class="wrap"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الكمية</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>

<script>
let items=[],counts={},cur=null,stream=null,camTimer=null;
const $=id=>document.getElementById(id);
const S=v=>v==null?'':String(v).trim();
const norm=t=>S(t).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const z=t=>S(t).replace(/^0+/,'');
const esc=t=>S(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(){try{return JSON.parse(localStorage.getItem('transfer_items')||'{}')}catch(e){return {}}},set(v){try{localStorage.setItem('transfer_items',JSON.stringify(v))}catch(e){}}};
counts=store.get();

function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=ok?880:200;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},ok?100:300)}catch(e){}}
function msg(t,ok){const m=$('msg');m.textContent=t;m.style.color=ok?'var(--ok)':'var(--pri)'}

let db=null,canUpd=false,meta=null,remote=false;
const CH=600;
function parse(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  const head=data[0].map(S);
  let ci=head.findIndex(h=>/كود|code|باركود|barcode/i.test(h));
  let ni=head.findIndex(h=>/اسم|صنف|وصف|name|item|desc/i.test(h));
  if(ci<0)ci=ni===0?1:0;
  if(ni<0||ni===ci)ni=ci===0?1:0;
  return data.slice(1).map(r=>({code:S(r[ci]),name:S(r[ni])})).filter(o=>o.code||o.name);
}
function setItems(arr){
  items=arr.map(o=>({code:o.code,name:o.name,k:norm(o.name+' '+o.code)}));
  $('scanCard').style.display=items.length?'block':'none';
  $('listCard').style.display=items.length?'block':'none';
}
function showInfo(extra){
  let t;
  if(items.length){t=`${items.length} صنف`;if(meta&&meta.updatedAt)t+=` — آخر تحديث: ${new Date(meta.updatedAt).toLocaleString('ar-EG')}`}
  else t=canUpd?'مفيش أصناف لسه — اضغط "تحديث الأصناف" وارفع ملف الإكسل (اسم + كود)':'مفيش أصناف لسه، اطلب من المسؤول يرفع ملف الأصناف';
  if(canUpd&&!remote)t+=' (محفوظة على الجهاز ده بس)';
  $('info').textContent=t+(extra?' — '+extra:'');
  $('updBox').style.display=canUpd?'flex':'none';
}
function cacheGet(){try{return JSON.parse(localStorage.getItem('catalog_cache')||'null')}catch(e){return null}}
function cacheSet(m,arr){try{localStorage.setItem('catalog_cache',JSON.stringify({meta:m,arr}))}catch(e){}}
async function loadCatalog(){
  try{
    if(typeof claude!=='undefined'&&claude.use){
      db=await claude.use('db');
      const u=await claude.use('user');
      canUpd=!!(u&&u.canEdit&&u.canEdit());
    }
  }catch(e){db=null}
  if(db){
    remote=true;
    try{
      const m=await db.doc('catalog/meta').get();
      if(m.exists){
        meta=m.data();
        const parts=await Promise.all(Array.from({length:meta.chunks},(_,i)=>db.doc('catalog/c'+i).get()));
        const arr=[];parts.forEach(p=>{if(p.exists)p.data().items.forEach(r=>arr.push({code:r[0],name:r[1]}))});
        setItems(arr);cacheSet(meta,arr);
      }
    }catch(e){
      const c=cacheGet();if(c){meta=c.meta;setItems(c.arr)}
    }
  }else{
    canUpd=true;const c=cacheGet();if(c){meta=c.meta;setItems(c.arr)}
  }
  showInfo();
}
async function saveCatalog(arr){
  const old=meta?meta.chunks:0,chunks=Math.ceil(arr.length/CH);
  const nm={chunks,count:arr.length,updatedAt:new Date().toISOString()};
  if(remote){
    for(let i=0;i<chunks;i++)await db.doc('catalog/c'+i).set({items:arr.slice(i*CH,(i+1)*CH).map(o=>[o.code,o.name])});
    await db.doc('catalog/meta').set(nm);
    for(let i=chunks;i<old;i++)await db.doc('catalog/c'+i).delete();
  }
  meta=nm;cacheSet(nm,arr);
}
$('updBtn').onclick=()=>{$('file').value='';$('file').click()};
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==='undefined'){$('info').textContent='مكتبة الإكسل مش متحملة، اتأكد من النت وحدّث الصفحة';return}
  let arr;
  try{arr=parse(await f.arrayBuffer())}catch(err){$('info').textContent='مقدرتش أقرا الملف، اتأكد إنه Excel';return}
  if(!arr.length){$('info').textContent='الملف فاضي أو الأعمدة مش واضحة';return}
  if(items.length&&!confirm(`هتستبدل ${items.length} صنف بـ ${arr.length} صنف جديد. متأكد؟`))return;
  $('info').textContent='جاري حفظ الأصناف...';
  try{await saveCatalog(arr);setItems(arr);showInfo('✅ تم التحديث')}
  catch(err){showInfo('❌ فشل الحفظ'+(err&&err.code?' ('+err.code+')':''))}
};

function pick(o){
  cur=o;beep(true);$('res').innerHTML='';msg('',true);
  $('iCode').textContent=o.code;$('iName').textContent=o.name;
  const p=counts[o.code];$('iPrev').textContent=p?`اتسجل قبل كده: ${p.qty}`:'';
  $('qty').value='';$('item').style.display='block';$('qty').focus();
}

function search(v,enter){
  v=S(v);cur=null;$('item').style.display='none';
  if(!v){$('res').innerHTML='';msg('',true);return}
  const exact=items.find(o=>o.code&&(o.code===v||z(o.code)===z(v)));
  if(exact&&enter){pick(exact);return}
  const words=norm(v).split(/\s+/).filter(Boolean);
  const found=items.filter(o=>words.every(w=>o.k.includes(w)));
  if(!found.length){$('res').innerHTML='';msg('❌ مفيش صنف بالاسم أو الكود ده',false);if(enter)beep(false);return}
  if(enter&&found.length===1){pick(found[0]);return}
  msg(found.length>15?`أول 15 نتيجة من ${found.length} — كمّل كتابة لتضييق البحث`:`${found.length} نتيجة — اختار الصنف`,true);
  $('res').innerHTML=found.slice(0,15).map((o,i)=>`<div class="r" data-i="${items.indexOf(o)}"><b>${esc(o.name)}</b><span class="mut">${esc(o.code)}</span></div>`).join('');
}
$('res').onclick=e=>{const r=e.target.closest('.r');if(r)pick(items[+r.dataset.i])};
$('scan').oninput=()=>search($('scan').value,false);
$('scan').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search($('scan').value,true)}};

function save(){
  if(!cur)return;const q=parseFloat($('qty').value);
  if(isNaN(q)||q<0){msg('اكتب الكمية الأول',false);$('qty').focus();return}
  const p=counts[cur.code];
  counts[cur.code]={code:cur.code,name:cur.name,qty:(p&&$('add').checked)?p.qty+q:q};
  store.set(counts);render();
  msg(`تم حفظ: ${cur.name} = ${counts[cur.code].qty}`,true);
  cur=null;$('item').style.display='none';$('scan').value='';$('scan').focus();
}
$('qty').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();save()}};
$('save').onclick=save;

function render(){
  const list=Object.values(counts).reverse();
  $('cnt').textContent=list.length;
  $('tb').innerHTML=list.map(o=>`<tr><td>${esc(o.code)}</td><td>${esc(o.name)}</td><td><input type="number" value="${o.qty}" data-c="${esc(o.code)}" style="width:90px;padding:6px"></td><td><button class="sec" data-d="${esc(o.code)}">حذف</button></td></tr>`).join('');
}
$('tb').onchange=e=>{const c=e.target.dataset.c;if(c&&counts[c]){counts[c].qty=parseFloat(e.target.value)||0;store.set(counts)}};
$('tb').onclick=e=>{const d=e.target.dataset.d;if(d){delete counts[d];store.set(counts);render()}};

$('exp').onclick=async()=>{
  const list=Object.values(counts);if(!list.length){msg('مفيش أصناف في التحويل لسه',false);return}
  if(typeof XLSX==='undefined'){msg('مكتبة الإكسل مش متحملة، اتأكد من النت وحدّث الصفحة',false);return}
  const ws=XLSX.utils.aoa_to_sheet([['كود الصنف','اسم الصنف','الكمية'],...list.map(o=>[o.code,o.name,o.qty])]);
  ws['!cols']=[{wch:16},{wch:40},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'التحويل');
  const fn=`transfer-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.xlsx`;
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  let dl=null;
  try{if(typeof claude!=='undefined'&&claude.use)dl=await claude.use('downloads')}catch(e){}
  if(dl){
    try{await dl.save({filename:fn,data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});msg('✅ تم تجهيز ملف الإكسل',true);return}
    catch(e){if(e&&e.code==='declined'){msg('اتلغى الحفظ',false);return}msg('فشل الحفظ ('+((e&&e.code)||'خطأ')+')',false)}
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
    msg('✅ تم تصدير الملف',true);
  }catch(e){msg('التصدير مش شغال في المتصفح ده، جرّب Chrome',false)}
};
$('clr').onclick=()=>{if(confirm('هتبدأ تحويل جديد وكل الأصناف الحالية هتتمسح. متأكد؟')){counts={};store.set(counts);render()}};

$('camBtn').onclick=async()=>{
  const v=$('vid');
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;clearInterval(camTimer);v.style.display='none';return}
  if(!('BarcodeDetector' in window)){msg('الكاميرا مش مدعومة في المتصفح ده، استخدم Chrome على الموبايل أو جهاز سكانر',false);return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=stream;v.style.display='block';await v.play();
    const det=new BarcodeDetector();
    camTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){$('camBtn').click();$('scan').value=r[0].rawValue;search(r[0].rawValue,true)}}catch(e){}},400);
  }catch(e){msg('مقدرتش أفتح الكاميرا',false)}
};
render();loadCatalog();
</script>
</body>
</html>
